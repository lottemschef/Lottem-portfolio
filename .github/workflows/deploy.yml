name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is already built in the repo — index.html, he/, assets/img
      # are committed. What is published is only what those pages link to:
      # the photograph masters in assets/photos, films no longer on the page,
      # the build scripts and the template stay in the repository and off the
      # web. tools/collect-site.py reads the pages to decide, and stops the
      # deploy if one of them links to a file that does not exist.
      - name: Collect the files the pages use
        run: python3 tools/collect-site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
